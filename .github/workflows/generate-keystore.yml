name: One-Off Release Keystore Generator

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Keystore Key Alias'
        required: true
        default: 'release-key'
      validity_years:
        description: 'Validity in years (min 25)'
        required: true
        default: '30'

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Random Passwords & Keystore
        id: gen
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 20)
          KEY_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 20)
          ALIAS="${{ github.event.inputs.key_alias }}"
          DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=LunaRP, OU=Mobile, O=ATMR, L=Unknown, ST=Unknown, C=US"

          CERT_SHA256=$(keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" | grep "SHA256:" | awk '{print $2}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          KEYSTORE_BASE64=$(base64 -w 0 release.keystore)

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KEYSTORE_BASE64"

          cat <<EOF > keystore-meta.json
          {
            "alias": "$ALIAS",
            "storePass": "$STORE_PASS",
            "keyPass": "$KEY_PASS",
            "certSha256": "$CERT_SHA256",
            "keystoreBase64": "$KEYSTORE_BASE64"
          }
          EOF

      - name: Upload Keystore Artifact for Secure Local Backup & Secret Setup
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: |
            release.keystore
            keystore-meta.json
          retention-days: 1
